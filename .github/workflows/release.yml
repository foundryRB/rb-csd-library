# rb-csd-library release: a thin caller of the org's reusable library workflow. The
# release logic lives once in foundryRB/rb-ci, so it cannot drift.
#
# On push to main, release-please maintains a per-package release PR from Conventional
# Commits; merging that PR cuts the tag + GitHub release and publishes the released npm
# packages to the public npm registry under @foundryrb, with provenance and no stored
# credential (each package names this file as its npm trusted publisher). See
# docs/adr/0002-release-automation.md, docs/adr/0003-public-npm-distribution.md and
# docs/adr/0005-rb-fork.md.
#
# The fork ships npm packages only: the Python runtimes (csd-intent, csd-pytest-intent)
# are consumed from PyPI as published upstream, so there is no PyPI publish job here.
name: release

on:
  push:
    branches: [main]
  # Recovery lever: re-drive release-please by hand when a push's run died before it
  # (e.g. the hygiene gate refusing a squash-merge's auto-added co-author trailer). A
  # merged release PR stays pending until a run cuts it; this cuts it without inventing
  # a commit.
  workflow_dispatch:

jobs:
  release:
    uses: foundryRB/rb-ci/.github/workflows/library.yml@main
    # id-token: write is what lets the publish sign a provenance attestation. The
    # called workflow declares it, and a called workflow may request only a SUBSET of
    # its caller's grant - so dropping it here fails the run at creation, not at publish.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets: inherit
